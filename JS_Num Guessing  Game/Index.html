<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Number Guessing Game</title>
</head>

<body>
    <!-- Main game container -->
    <main class="body">
        <!-- Game box section -->
        <div class="container">
            <h1>Number Guessing Game</h1>
            <p>Guess a number between 1 and 100</p>

            <!-- Guess number input field -->
            <form class="guessForm">
                <input type="text" id="guessField" class="guessField">
                <input type="submit" value="Submit guess" class="guessBtn">
            </form>
            <!-- Result phase Section -->
            <div class="resultPhase">
                <p>Previous guess: <span id="previousGuess"></span></p>
                <p>Guess count: <span id="guessCount"></span></p>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>

</html>
